name: SafeLink checks
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: write
jobs:
  web-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test
        working-directory: mobile
      - run: flutter build apk --debug
        working-directory: mobile
      - name: Upload SafeLink AI Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeLink-AI-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
      - name: Publish Direct APK Download Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: SafeLink AI Mobile App v1.0.0
          body: "Direct download link for SafeLink AI Android APK. Tap below to install directly on your phone."
          files: mobile/build/app/outputs/flutter-apk/app-debug.apk

