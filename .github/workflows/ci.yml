name: SafeLink checks
on:
  workflow_dispatch:
  push:
    branches: [master, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  web-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm audit --prod --audit-level=high
      - run: node node_modules/drizzle-kit/bin.cjs check
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test
        working-directory: mobile
      - run: flutter build apk --debug --dart-define="API_URL=$SAFELINK_API_URL"
        working-directory: mobile
        env:
          SAFELINK_API_URL: ${{ vars.SAFELINK_API_URL || 'https://safelink-ai-8q6c.onrender.com' }}
      - name: Verify APK and record checksum
        working-directory: mobile/build/app/outputs/flutter-apk
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app-debug.apk
          sha256sum app-debug.apk > app-debug.apk.sha256
      - name: Upload SafeLink AI Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeLink-AI-debug-apk
          path: |
            mobile/build/app/outputs/flutter-apk/app-debug.apk
            mobile/build/app/outputs/flutter-apk/app-debug.apk.sha256
          if-no-files-found: error
