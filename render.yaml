services:
  - type: web
    name: safelink-ai
    runtime: docker
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: DEMO_MEMORY
        value: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: MISTRAL_KEY
        sync: false
      - key: SAFE_BROWSING_API_KEY
        sync: false
